<div class="app-shell" [class.dark]="isDarkMode">
  <app-sidebar [queueLength]="queue.length" (scrollRequested)="scrollTo($event)"></app-sidebar>
  <div class="workspace">
    <header class="topbar">
      <div class="mobile-brand"><span>M</span> Medbook</div>
      <div class="topbar-status"><i></i> System operational</div>
      <div class="topbar-actions">
        <button class="icon-button" (click)="loadQueue()" [disabled]="loading" aria-label="Refresh queue" title="Refresh queue">↻</button>
        <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Use light mode' : 'Use dark mode'"><span>{{ isDarkMode ? 'Light' : 'Dark' }}</span></button>
      </div>
    </header>
    <main>
      <div class="notice success" *ngIf="message"><span>✓</span>{{ message }}</div>
      <div class="notice error" *ngIf="error"><span>!</span>{{ error }}</div>
      <app-queue-board [queue]="queue" [nextCustomer]="nextCustomer" [activeCustomer]="activeCustomer" (statusChanged)="changeStatus($event.customer, $event.status)"></app-queue-board>
      <app-customer-form (formSubmit)="onAddCustomer($event)"></app-customer-form>
    </main>
  </div>
</div>
